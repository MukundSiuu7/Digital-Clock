<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <button class="button">
            <a href="index.html">
                <span class="popup">Home</span>
                <i class="fas fa-home"></i>
            </a>
        </button>

        <button class="button">
            <a href="clocks.html">
                <span class="popup">Clocks</span>
                <i class="fas fa-clock"></i>
            </a>
        </button>

        <button class="button">
            <a href="team.html">
                <span class="popup">Team</span>
                <i class="fas fa-users"></i>
            </a>
        </button>

        <button class="button">
            <a href="about.html">
                <span class="popup">About</span>
                <i class="fas fa-info-circle"></i>
            </a>
        </button>

        <button class="button">
            <a href="matrix.html">
                <span class="popup">Matrix</span>
                <i class="fas fa-terminal"></i>
            </a>
        </button>
    </nav>

    <main class="container">
        <div class="header">
            <h1>Digital Clock</h1>
        </div>

        <div class="clock-container">
            <div class="clock">
                <div id="time" class="time"></div>
                <div id="date" class="date"></div>
            </div>

            <div class="controls">
                <button id="format-toggle" class="control-btn" title="Toggle 12/24 hour format">
                    <i class="fas fa-clock"></i>
                    <span>12/24</span>
                </button>
                
                <button id="seconds-toggle" class="control-btn" title="Toggle seconds display">
                    <i class="fas fa-stopwatch"></i>
                    <span>SEC</span>
                </button>

                <button id="fullscreen-btn" class="control-btn" title="Toggle fullscreen">
                    <i class="fas fa-expand"></i>
                    <span>FULL</span>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
