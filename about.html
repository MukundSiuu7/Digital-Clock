<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&q=80') center/cover no-repeat;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 2rem;
            max-width: 800px;
            margin: 2rem auto;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .game-title {
            color: var(--text-color);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        #gameCanvas {
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        .control-btn {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--primary-color);
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .score-display {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 1rem 0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 15px;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            text-align: center;
            display: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .about-content {
            color: var(--text-color);
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            line-height: 1.6;
        }

        .about-content h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .about-content p {
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        #muteButton {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="space-background"></div>
    <div class="stars" id="starsContainer"></div>
    <button id="muteButton"><i class="fas fa-volume-up"></i></button>

    <nav class="navbar">
        <button class="button">
            <a href="index.html">
                <span class="popup">Home</span>
                <i class="fas fa-home"></i>
            </a>
        </button>

        <button class="button">
            <a href="clocks.html">
                <span class="popup">Clocks</span>
                <i class="fas fa-clock"></i>
            </a>
        </button>

        <button class="button">
            <a href="team.html">
                <span class="popup">Team</span>
                <i class="fas fa-users"></i>
            </a>
        </button>

        <button class="button">
            <a href="about.html">
                <span class="popup">About</span>
                <i class="fas fa-info-circle"></i>
            </a>
        </button>

        <button class="button">
            <a href="matrix.html">
                <span class="popup">Matrix</span>
                <i class="fas fa-terminal"></i>
            </a>
        </button>
    </nav>

    <main class="container">
        <div class="header">
            <h1>Space UFO Game</h1>
        </div>

        <div class="game-container">
            <h2 class="game-title">UFO Helmet Hunter</h2>
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            <div class="score-display">Score: <span id="score">0</span></div>
            <div class="game-controls">
                <button class="control-btn" id="startButton">Start Game</button>
                <button class="control-btn" id="restartButton" style="display: none;">Restart</button>
            </div>
        </div>

        <div class="about-content">
            <h2>About the Game</h2>
            <p>Guide your UFO through space to collect astronaut helmets. Use arrow keys or WASD to move. Don't hit the walls or yourself!</p>
            <p>The more helmets you collect, the faster your UFO moves. How many can you catch?</p>
        </div>
    </main>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="control-btn" onclick="restartGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const muteButton = document.getElementById('muteButton');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        let snake = [];
        let food = {};
        let dx = 10;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let gameStarted = false;
        let gameSpeed = 100;
        
        const backgroundMusic = new Audio('little-dark-age.mp3');
        backgroundMusic.loop = true;
        const collectSound = new Audio('collect.mp3');
        let isMuted = false;

        const ufoImg = new Image();
        ufoImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjMDBmZjAwIiBkPSJNMjU2IDMyYzg4LjQgMCAxNjAgNzEuNiAxNjAgMTYwYzAgMi45LS4xIDUuOC0uMyA4LjdDNDU5LjggMjE5LjIgNDk2IDI2OS4zIDQ5NiAzMjhjMCA3MC43LTU3LjMgMTI4LTEyOCAxMjhIMTQ0Yy03MC43IDAtMTI4LTU3LjMtMTI4LTEyOGMwLTU4LjcgMzYuMi0xMDguOCA4MC4zLTEyNy4zYy0uMi0yLjktLjMtNS44LS4zLTguN2MwLTg4LjQgNzEuNi0xNjAgMTYwLTE2MHoiLz48L3N2Zz4=';

        const helmetImg = new Image();
        helmetImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjZmZmZmZmIiBkPSJNMjU2IDQ4QzE0MS4xIDQ4IDQ4IDE0MS4xIDQ4IDI1NnM5My4xIDIwOCAyMDggMjA4IDIwOC05My4xIDIwOC0yMDhTMzcwLjkgNDggMjU2IDQ4em0wIDM3MmMtOTAuNSAwLTE2NC03My41LTE2NC0xNjRzNzMuNS0xNjQgMTY0LTE2NCAxNjQgNzMuNSAxNjQgMTY0LTczLjUgMTY0LTE2NCAxNjR6Ii8+PC9zdmc+';

        function initGame() {
            snake = [{x: 300, y: 200}];
            food = generateFood();
            dx = 10;
            dy = 0;
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            gameOverScreen.style.display = 'none';
        }

        function generateFood() {
            return {
                x: Math.floor(Math.random() * (canvas.width - 20) / 10) * 10,
                y: Math.floor(Math.random() * (canvas.height - 20) / 10) * 10
            };
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(ufoImg, snake[0].x, snake[0].y, 20, 20);
            ctx.drawImage(helmetImg, food.x, food.y, 20, 20);
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                if (!isMuted) collectSound.play();
                score += 10;
                scoreElement.textContent = score;
                food = generateFood();
                gameSpeed = Math.max(50, gameSpeed - 2);
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, gameSpeed);
            } else {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];
            return (
                head.x < 0 ||
                head.x >= canvas.width ||
                head.y < 0 ||
                head.y >= canvas.height
            );
        }

        function gameStep() {
            if (checkCollision()) {
                gameOver();
                return;
            }
            moveSnake();
            drawGame();
        }

        function gameOver() {
            clearInterval(gameLoop);
            gameStarted = false;
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
            startButton.style.display = 'none';
            restartButton.style.display = 'inline-block';
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        function startGame() {
            if (!gameStarted) {
                initGame();
                gameStarted = true;
                gameLoop = setInterval(gameStep, gameSpeed);
                startButton.style.display = 'none';
                restartButton.style.display = 'inline-block';
                if (!isMuted) backgroundMusic.play();
            }
        }

        function restartGame() {
            initGame();
            gameStarted = true;
            gameLoop = setInterval(gameStep, gameSpeed);
            if (!isMuted) backgroundMusic.play();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                    if (dy !== 10) { dx = 0; dy = -10; }
                    break;
                case 'ArrowDown':
                case 's':
                    if (dy !== -10) { dx = 0; dy = 10; }
                    break;
                case 'ArrowLeft':
                case 'a':
                    if (dx !== 10) { dx = -10; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                    if (dx !== -10) { dx = 10; dy = 0; }
                    break;
            }
        });

        muteButton.addEventListener('click', () => {
            isMuted = !isMuted;
            muteButton.innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            if (isMuted) {
                backgroundMusic.pause();
            } else if (gameStarted) {
                backgroundMusic.play();
            }
        });

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', restartGame);

        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--twinkle-duration', `${Math.random() * 3 + 2}s`);
                container.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            initGame();
            drawGame();
        });
    </script>
</body>
</html>
