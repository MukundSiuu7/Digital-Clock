<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Clocks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&q=80') center/cover no-repeat;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .clock-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .clock-title {
            color: var(--text-color);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .clock-time {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .clock-date {
            color: var(--text-color);
            font-size: 1rem;
            opacity: 0.8;
        }

        .planet-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--twinkle-duration) ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="space-background"></div>
    <div class="stars" id="starsContainer"></div>

    <nav class="navbar">
        <button class="button">
            <a href="index.html">
                <span class="popup">Home</span>
                <i class="fas fa-home"></i>
            </a>
        </button>

        <button class="button">
            <a href="clocks.html">
                <span class="popup">Clocks</span>
                <i class="fas fa-clock"></i>
            </a>
        </button>

        <button class="button">
            <a href="team.html">
                <span class="popup">Team</span>
                <i class="fas fa-users"></i>
            </a>
        </button>

        <button class="button">
            <a href="about.html">
                <span class="popup">About</span>
                <i class="fas fa-info-circle"></i>
            </a>
        </button>

        <button class="button">
            <a href="matrix.html">
                <span class="popup">Matrix</span>
                <i class="fas fa-terminal"></i>
            </a>
        </button>
    </nav>

    <main class="container">
        <div class="header">
            <h1>Space Clocks</h1>
        </div>

        <div class="clock-grid">
            <div class="clock-card">
                <i class="fas fa-globe-americas planet-icon"></i>
                <div class="clock-title">New York</div>
                <div class="clock-time" id="new-york-time"></div>
                <div class="clock-date" id="new-york-date"></div>
            </div>

            <div class="clock-card">
                <i class="fas fa-globe-europe planet-icon"></i>
                <div class="clock-title">London</div>
                <div class="clock-time" id="london-time"></div>
                <div class="clock-date" id="london-date"></div>
            </div>

            <div class="clock-card">
                <i class="fas fa-globe-asia planet-icon"></i>
                <div class="clock-title">Tokyo</div>
                <div class="clock-time" id="tokyo-time"></div>
                <div class="clock-date" id="tokyo-date"></div>
            </div>

            <div class="clock-card">
                <i class="fas fa-globe-asia planet-icon"></i>
                <div class="clock-title">Sydney</div>
                <div class="clock-time" id="sydney-time"></div>
                <div class="clock-date" id="sydney-date"></div>
            </div>
        </div>
    </main>

    <script>
        // Create twinkling stars
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Random size
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random twinkle duration
                star.style.setProperty('--twinkle-duration', `${Math.random() * 3 + 2}s`);
                
                container.appendChild(star);
            }
        }

        // Update clocks function
        function updateClocks() {
            const timeFormat = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateFormat = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

            const locations = {
                'new-york': 'America/New_York',
                'london': 'Europe/London',
                'tokyo': 'Asia/Tokyo',
                'sydney': 'Australia/Sydney'
            };

            for (const [city, timezone] of Object.entries(locations)) {
                try {
                    const now = new Date().toLocaleString('en-US', { timeZone: timezone });
                    const date = new Date(now);
                    
                    document.getElementById(`${city}-time`).textContent = 
                        date.toLocaleTimeString('en-US', timeFormat);
                    document.getElementById(`${city}-date`).textContent = 
                        date.toLocaleDateString('en-US', dateFormat);
                } catch (error) {
                    console.error(`Error updating ${city} clock:`, error);
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            updateClocks();
            setInterval(updateClocks, 1000);
        });
    </script>
</body>
</html>
