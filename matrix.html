<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Than College Seminar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: monospace;
            text-align: center;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
        button {
            position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  padding: 10px 20px;
  text-transform: uppercase;
  border-radius: 8px;
  font-size: 17px;
  font-weight: 500;
  color: #ffffff80;
  text-shadow: none;
  background: transparent;
  cursor: pointer;
  box-shadow: transparent;
  border: 1px solid #ffffff80;
  transition: 0.5s ease;
  user-select: none;
  
}

#btn:hover,
:focus {
  color: #ffffff;
  background: #00ff37;
  border: 1px solid #00ff37;
  text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
  box-shadow: 0 0 5px #00ff37, 0 0 20px #00ff37, 0 0 50px #00ff37,
    0 0 100px #00ff37;
}

    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <button class="btn" id="btn">-- . ... ... .- --. . / ..-. --- .-. / .... . .-.</button>
    <audio id="bgMusic" loop>
        <source src="And I Love Her.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <script>
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");
        const bgMusic = document.getElementById("bgMusic");
        const playMusicBtn = document.getElementById("btn");

        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        setupCanvas();
        window.addEventListener("resize", setupCanvas);
        
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*";
        const chars = matrixChars.split("");
        const messages = ["HELLO", "MUKI", "P", "75"];
        const fontSize = Math.max(16, canvas.width / 100);
        const messageFontSize = fontSize + 8;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = new Array(columns).fill(1);
        
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < drops.length; i++) {
                let text = chars[Math.floor(Math.random() * chars.length)];
                let isMessage = false;

                if (Math.random() < 0.01) {  
                    text = messages[Math.floor(Math.random() * messages.length)];
                    isMessage = true;
                }

                ctx.font = isMessage ? `${messageFontSize}px monospace` : `${fontSize}px monospace`;
                ctx.fillStyle = isMessage ? "#FF0000" : "#0F0";

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        playMusicBtn.addEventListener("click", () => {
            bgMusic.play().catch(error => console.log("Music autoplay blocked:", error));
            playMusicBtn.style.display = "none";
        });
    </script>
</body>
</html>
